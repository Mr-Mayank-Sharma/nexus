spring.application.name=nexus-gateway
server.port=${PORT:8097}

# PostgreSQL in production (NEXUS_GATEWAY_DB_URL); a local H2 file otherwise.
spring.datasource.url=${NEXUS_GATEWAY_DB_URL:jdbc:h2:file:./data/gateway;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${NEXUS_GATEWAY_DB_USERNAME:sa}
spring.datasource.password=${NEXUS_GATEWAY_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Secrets come from the environment only.
nexus.gateway.master-key=${NEXUS_GATEWAY_MASTER_KEY:}
nexus.gateway.admin-token=${NEXUS_GATEWAY_ADMIN_TOKEN:}

management.endpoints.web.exposure.include=health
