# =============================================================================
# Trivy suppressions — deliberately time-boxed.
#
# Why this file exists: the "Trivy scan — application vulnerabilities" step
# (scan-type: config, scan-ref: ., exit-code: "1") has always been a hard gate,
# but it never actually ran in CI — the OS scan failed first and aborted the
# docker job. Now that the OS gate is clean and the job runs to completion, this
# gate executes for the first time and reports the 6 pre-existing HIGH findings
# below. They are real and pre-existing; they are NOT introduced by the OS CVE
# work.
#
# These entries do not fix anything. They keep the gate ARMED for new misconfigurations
# while the known debt below is remediated, instead of leaving the gate permanently
# silenced with exit-code: "0". Every entry carries an expiry so it cannot
# quietly become permanent, and a suppressions file with real entries + dates is
# auditable in a way that a lowered exit code is not.
#
# Follow-up PR (must delete the corresponding entry in the SAME commit):
#   "fix(deploy): non-root frontend image and read-only root filesystems"
#
# Verify locally with:
#   trivy config --severity HIGH,CRITICAL --exit-code 1 .
# =============================================================================

misconfigurations:
  # ---------------------------------------------------------------------------
  # KSV-0014 — root filesystem is writable.
  #
  # All five workloads already run non-root and, for the stateful services, the
  # data path is already a PVC. The only missing piece is the writable mounts.
  # Turning on readOnlyRootFilesystem WITHOUT these mounts crash-loops the pods,
  # because the root filesystem becomes read-only before the app can start:
  #
  #   backend.yaml  -> /tmp                            (Java temp, Tomcat work dir)
  #   frontend.yaml -> /tmp, /var/cache/nginx, /var/run (nginx cache dir, nginx.pid)
  #   postgres.yaml -> /tmp, /var/run/postgresql       (unix socket dir; pg16
  #                                                      refuses to start without it)
  #   redis.yaml    -> /tmp                            (data already on PVC at /data)
  #   kafka.yaml    -> /tmp                            (data already on PVC at
  #                                                      /var/lib/kafka/data)
  #
  # Each mount should be an emptyDir volume, except the stateful data paths which
  # are already PVCs and must stay PVCs — an emptyDir there would silently lose
  # data on every pod restart.
  #
  # Not landed in the CVE PR: the review environment has neither `helm` (so the
  # templates cannot even be render-validated) nor a cluster (so pod startup
  # cannot be exercised). Editing five production manifests blind to make a
  # scanner go green trades a visible warning for a much worse failure mode.
  # ---------------------------------------------------------------------------
  - id: KSV-0014
    paths:
      - deploy/helm/nexus/templates/backend.yaml
      - deploy/helm/nexus/templates/frontend.yaml
      - deploy/helm/nexus/templates/postgres.yaml
      - deploy/helm/nexus/templates/redis.yaml
      - deploy/helm/nexus/templates/kafka.yaml
    statement: |
      Tracked hardening debt, expires 2027-01-03. All five workloads already set
      runAsNonRoot and the stateful data paths are already PVCs. Requires adding
      emptyDir mounts for /tmp (all five), /var/cache/nginx + /var/run (frontend)
      and /var/run/postgresql (postgres) BEFORE setting
      securityContext.readOnlyRootFilesystem: true. Cannot be render-validated
      (no helm) or startup-validated (no cluster) in a CVE patch.
    expired_at: 2027-01-03T00:00:00Z

  # ---------------------------------------------------------------------------
  # DS-0002 — image runs as root.
  #
  # nexus-oms-frontend/Dockerfile is nginx:alpine with no USER directive. Note the
  # chart already pins runAsUser: 101 (the nginx uid in that image), so the
  # DEPLOYED frontend is already non-root; the image is simply out of step with
  # the chart, and stays root under `docker run` / the local build.
  #
  # The backend Dockerfile is not listed because it already has `USER nexus`.
  #
  # Fix requires BOTH halves, or the deployment breaks:
  #   1. `USER 101` on the nginx runtime stage in nexus-oms-frontend/Dockerfile
  #   2. capabilities.add: [NET_BIND_SERVICE] on the frontend container
  #      — nginx cannot bind :80 as a non-root user without this
  #
  # Do NOT "fix" this by switching to nginx-unprivileged on port 8080 without
  # also updating the containerPort, the readiness/liveness probes (both currently
  # hit the container's :80) and the Service targetPort.
  # ---------------------------------------------------------------------------
  - id: DS-0002
    paths:
      - nexus-oms-frontend/Dockerfile
    statement: |
      Tracked hardening debt, expires 2027-01-03. The Helm chart already pins
      runAsUser: 101 so the deployed container is non-root; the image lacks USER.
      Fix by adding `USER 101` to the nginx runtime stage AND granting
      capabilities.add: [NET_BIND_SERVICE] to the frontend container, since nginx
      needs it to bind port 80 as a non-root user. Both halves are required.
    expired_at: 2027-01-03T00:00:00Z

vulnerabilities:
  # ---------------------------------------------------------------------------
  # CVE-2026-47884 — spring-webmvc: RCE via improper path limitation in XsltView.
  #
  # Installed: 6.2.19 (via spring-boot-starter-parent 3.5.16, the last 3.5.x).
  # Trivy lists the fix only in 7.0.9; no 6.2.x release newer than 6.2.19 exists
  # on Maven Central (checked 2026-10-09), so the only real fix is the Spring Boot
  # 4 / Spring Framework 7 migration (docs/13 roadmap, Phase A).
  #
  # Exposure: the vulnerable code path is org.springframework.web.servlet.view.xslt
  # .XsltView. Nexus registers no XSLT views and has no xslt templates
  # (grep -ri "XsltView\|xslt" nexus-oms-backend/src/main returns nothing); it is
  # a JSON REST API. Short expiry so the migration cannot slip silently.
  # ---------------------------------------------------------------------------
  - id: CVE-2026-47884
    statement: |
      Not reachable: no XsltView is configured or used. Fixed only in Spring
      Framework 7.0.9; remove this entry in the Spring Boot 4 migration commit.
    expired_at: 2026-12-31T00:00:00Z
