# NexusShip OMS — Helm values
# Mirrors docker-compose.prod.yml. Secrets come from Kubernetes Secrets (not these values).
replicaCount: 2

# Image coordinates MUST match the GHCR artifacts built and pushed by
# .github/workflows/ci.yml + cd.yml (nexus-oms-backend / nexus-oms-frontend).
# The previous defaults were `nexus/oms-backend:1.0.0` with no registry host,
# which silently resolved to Docker Hub and could never pull.
#
# Unlike docker-compose.prod.yml, Helm does NOT interpolate environment
# variables, so you must supply the release coordinates at install time —
# use the same values cd.yml writes into .env for the Compose path:
#   helm upgrade --install nexus deploy/helm/nexus \
#     --set image.backend.repository=ghcr.io/<owner>/nexus-oms-backend \
#     --set image.frontend.repository=ghcr.io/<owner>/nexus-oms-frontend \
#     --set image.backend.tag=sha-xxxxxxxx \
#     --set image.frontend.tag=sha-xxxxxxxx
# Pin an immutable sha-* tag, never :latest — every CI build pushes :latest,
# so it is not a rollback target.
image:
  backend:
    repository: ghcr.io/nexus/nexus-oms-backend
    tag: "latest"
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/nexus/nexus-oms-frontend
    tag: "latest"
    pullPolicy: IfNotPresent

backend:
  resources:
    limits:
      memory: 1Gi
      cpu: "1"
    requests:
      memory: 512Mi
      cpu: 250m
  service:
    type: ClusterIP
    port: 8080

frontend:
  service:
    type: ClusterIP
    port: 80

postgres:
  enabled: true
  image: pgvector/pgvector:pg16
  storage: 20Gi
  storageClass: ""
  resources:
    requests:
      memory: 512Mi
      cpu: 250m

redis:
  enabled: true
  image: redis:7-alpine
  storage: 5Gi
  storageClass: ""
  resources:
    requests:
      memory: 256Mi
      cpu: 100m

kafka:
  enabled: true
  image: apache/kafka:3.7.2
  storage: 20Gi
  storageClass: ""
  resources:
    requests:
      memory: 1Gi
      cpu: 500m

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: oms.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - oms.example.com
      secretName: nexus-tls

env:
  springProfilesActive: prod
  corsOrigins: "https://oms.example.com"
  frontendUrl: "https://oms.example.com"
  dbPoolMax: "30"
  dbPoolMin: "10"
  aiEnabled: "false"

secrets:
  # Set to true to let the chart create the Secret from the values below.
  # Recommended for production: false, and pre-create the Secret externally.
  create: false
  existingSecret: nexus-secrets
  # Required keys in the referenced Secret:
  #   db-password, redis-password, jwt-secret, openai-api-key
  dbPassword: ""
  redisPassword: ""
  jwtSecret: ""
  # templates/secret.yaml reads this as
  # `.Values.secrets.openaiApiKey | default ""`. Declared here so `helm show
  # values` documents it and `--set secrets.openaiApiKey=...` is a known key.
  openaiApiKey: ""

backup:
  enabled: false
  schedule: "0 2 * * *"
  retention: 14
  # PVC claimName to persist backups across Jobs (e.g. a pre-created PVC).
  # If empty, backups go to emptyDir (non-persistent — not recommended).
  volumeClaim: ""

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - nexus-backend
          topologyKey: kubernetes.io/hostname
