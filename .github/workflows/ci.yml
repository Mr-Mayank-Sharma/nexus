name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  # NOTE: do NOT add "${{ github.* }}" values here. Workflow-level `env:` cannot
  # reference the github context, and GitHub rejects the whole file at parse time
  # (run fails in 0s with "This run likely failed because of a workflow file
  # issue"). Jobs that need the owner must read github.repository_owner inside a
  # `run:` step or a step-level `env:` block, which is where the context is legal.

permissions:
  contents: read
  security-events: write
  pull-requests: write
  # Required by github/codeql-action/upload-sarif: it calls the workflow-runs
  # API (get-a-workflow-run) to resolve the head SHA, and without this scope it
  # fails every upload with "Resource not accessible by integration".
  actions: read

jobs:
  # ──────────────────────────────────────────────
  # Docs: documented counts must match the source tree
  # Runs first and needs no build; the backend job repeats the full check
  # after `mvn verify`, where surefire reports make the test-count claims
  # checkable too.
  # ──────────────────────────────────────────────
  docs:
    name: Docs Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify documented claims against source
        run: python3 scripts/verify_docs.py --no-surefire

  # ──────────────────────────────────────────────
  # Backend: build, test, coverage, SAST, dependency audit
  # ──────────────────────────────────────────────
  backend:
    # Literal, not `${{ env.JAVA_VERSION }}`. The `env` context is NOT available
    # at `jobs.<id>.name` evaluation time, and referencing it here is a FATAL
    # workflow-file parse error: GitHub rejects the entire file, the workflow is
    # registered with its path instead of its `name:`, and every run fails
    # instantly with total_jobs=0. This silently broke 100/100 CI runs from the
    # initial commit through 931f2e1. Keep this in sync with env.JAVA_VERSION.
    name: Backend (Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nexus-oms-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compile and run tests with JaCoCo
        run: mvn verify -B

      # Full check, including the documented test counts: surefire reports
      # only exist once the suite has run.
      - name: Verify documented test counts against surefire
        working-directory: .
        run: python3 scripts/verify_docs.py

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-backend-report
          path: nexus-oms-backend/target/site/jacoco/
          retention-days: 14

      - name: OWASP dependency-check
        run: mvn dependency-check:check -B
        continue-on-error: true
        env:
          # Optional: add an NVD_API_KEY repo secret and the scan starts using
          # real advisory data. Without it NVD answers 403/404 and the goal
          # aborts with NoDataException -- which is why this step is
          # continue-on-error. It must never gate the build; `mvn verify` no
          # longer runs this goal (see <phase>none</phase> in the pom).
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: nexus-oms-backend/target/dependency-check-report.*
          retention-days: 14

  # ──────────────────────────────────────────────
  # Frontend: install, lint, build, audit
  # ──────────────────────────────────────────────
  frontend:
    # Same constraint as the backend job name above. Keep in sync with
    # env.NODE_VERSION.
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nexus-oms-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: nexus-oms-frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

      # Gate on what actually reaches the browser. Clean as of 83710fa:
      # the previous 6 production highs were an artifact of
      # tailwindcss-animate being misfiled under dependencies, which dragged
      # tailwindcss -> chokidar -> braces/micromatch/fast-glob into the
      # shipped graph.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      # Build toolchain only: tailwindcss 3, vite 5, vite-plugin-pwa 0.19
      # and their transitives. None of it ships. Reported so it stays
      # visible, non-blocking until the major upgrades land.
      - name: Audit build toolchain (non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true

  # ──────────────────────────────────────────────
  # Python AI services: install + pip-audit
  # ──────────────────────────────────────────────
  python-ai:
    name: AI Service 1
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./supply_chain_ai
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: supply_chain_ai/requirements.txt

      - run: pip install -r requirements.txt
      - run: pip install pip-audit
      - run: pip-audit
        continue-on-error: true

  python-ai2:
    name: AI Service 2
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./supply_chain_ai2
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: supply_chain_ai2/requirements.txt

      - run: pip install -r requirements.txt
      - run: pip install pip-audit
      - run: pip-audit
        continue-on-error: true

  # ──────────────────────────────────────────────
  # CodeQL: SAST static analysis (separate job, runs in parallel)
  # ──────────────────────────────────────────────
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # Job-level permissions override the workflow-level block, so this must
      # be repeated here: CodeQL's analysis step calls the workflow-runs API
      # and fails with "Resource not accessible by integration" without it.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [java, javascript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config: |
            paths-ignore:
              - '**/node_modules'
              - '**/target'
              - '**/dist'
              - 'supply_chain_ai/**'
              - 'supply_chain_ai2/**'

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # ──────────────────────────────────────────────
  # SonarQube: code quality + security analysis
  # Requires secrets: SONAR_TOKEN, SONAR_HOST_URL
  # ──────────────────────────────────────────────
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [backend]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarQube blame data

      - name: Download JaCoCo report
        uses: actions/download-artifact@v8
        with:
          name: jacoco-backend-report
          path: nexus-oms-backend/target/site/jacoco/

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=nexus-ship
            -Dsonar.organization=nexus-ship
            -Dsonar.sources=nexus-oms-backend/src/main/java
            -Dsonar.tests=nexus-oms-backend/src/test/java
            -Dsonar.java.binaries=nexus-oms-backend/target/classes
            -Dsonar.java.libraries=nexus-oms-backend/target/dependency
            -Dsonar.coverage.jacoco.xmlReportPaths=nexus-oms-backend/target/site/jacoco/jacoco.xml
            -Dsonar.qualitygate.wait=true

      - name: SonarQube Quality Gate Check
        if: always()
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ──────────────────────────────────────────────
  # Docker build + Trivy container scan
  # ──────────────────────────────────────────────
  docker:
    name: Docker Build & Container Scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          # MUST match the backend entry in cd.yml. This job used to scan the
          # root ./Dockerfile while production deployed the image built from
          # nexus-oms-backend/Dockerfile, so the artifact that actually shipped
          # was never scanned.
          context: ./nexus-oms-backend
          file: ./nexus-oms-backend/Dockerfile
          push: false
          load: true
          tags: nexus-oms-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan — OS vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nexus-oms-backend:test
          format: sarif
          output: trivy-os-results.sarif
          severity: CRITICAL,HIGH
          # REQUIRED for SARIF format. trivy-action's entrypoint UNSETS
          # TRIVY_SEVERITY when format=sarif unless this is true, so the scan
          # runs with ALL severities and exit-code 1 trips on LOW/MEDIUM
          # findings. Verified on v0.75.0: this image has 0 CRITICAL/0 HIGH but
          # 43 LOW/MEDIUM OS vulns — without this line the gate fails on
          # findings it explicitly says it ignores.
          limit-severities-for-sarif: true
          # `vuln-type` defaults to "os,library", so without this line the step
          # also scanned the bundled app.jar and reported Maven dependency CVEs
          # — i.e. it did not do what its name says. Pin it to "os" so this hard
          # gate covers OS packages only, which is the class we can actually
          # patch in the Dockerfile. Library deps get their own step below.
          vuln-type: os
          # Pinned so this gate is reproducible. The action's default happens to
          # be v0.75.0 today, which is the exact version these results were
          # verified against; letting the default drift silently would change
          # scanner behaviour with no diff to review.
          version: v0.75.0
          # Hard gate, matching cd.yml. This used to be exit-code "0" +
          # continue-on-error, i.e. a scan that could never fail anything and
          # only ever wrote a SARIF file nobody acted on. Now that this job
          # builds the exact image CD deploys, a CRITICAL/HIGH finding here is
          # one CD would reject downstream anyway — failing early is just
          # cheaper than failing after merge.
          exit-code: "1"

      - name: Trivy scan — dependency (library) vulnerabilities
        uses: aquasecurity/trivy-action@master
        # Non-blocking ON PURPOSE. This is tracked debt, not an oversight.
        # 52 HIGH/CRITICAL (10 CRITICAL) originate from the Spring Boot 3.2.5
        # BOM: Spring Framework 6.1.6, Spring Security 6.2.4, Tomcat 10.1.20,
        # Netty 4.1.109.Final, Jackson 2.15.4. Clearing them requires moving the
        # parent to Spring Boot 3.5.x, which pulls Spring Security 6.5 and
        # Spring Framework 6.2.x and can break the test suite, the JaCoCo gate,
        # and scripts/verify_docs.py's documented-test-count guard. That belongs
        # in its own PR with its own review — not bundled into a CVE patch.
        #
        # Flip exit-code to "1" and drop continue-on-error in the SAME commit
        # that lands the upgrade, so this gate cannot silently drift back.
        #
        # Findings are still uploaded to the Security tab below, so the debt
        # stays visible and trackable rather than merely ignored.
        continue-on-error: true
        with:
          image-ref: nexus-oms-backend:test
          format: sarif
          output: trivy-library-results.sarif
          severity: CRITICAL,HIGH
          vuln-type: library
          exit-code: "0"
          # Pinned for the same reason as the OS step above — these counts were
          # verified on v0.75.0 and the gate must not drift under us.
          version: v0.75.0

      - name: Trivy scan — application vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          # NOTE: no `image-ref` here ON PURPOSE. This is a config scan of the
          # repo (scan-ref: .), and trivy-action uses image-ref as the scan
          # target when it is set — even for scan-type: config — so trivy tried
          # to `lstat nexus-oms-backend:test` as a filesystem path and died with
          # "no such file or directory". Verified in CI run 37505346989.
          format: sarif
          output: trivy-app-results.sarif
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          # Same as the OS scan: SARIF format unsets the severity filter unless
          # this is true, so the gate would fail on LOW/MEDIUM config findings
          # (verified: 11-12 LOW/MEDIUM, 0 HIGH/CRITICAL).
          limit-severities-for-sarif: true
          # Same reasoning as the OS scan above: gate it instead of recording
          # findings nobody reads.
          exit-code: "1"
          # REQUIRED, and not obvious. Trivy does NOT auto-discover
          # .trivyignore.yaml when scanning a directory. Verified against
          # v0.75.0: `trivy config --severity HIGH,CRITICAL --exit-code 1 .`
          # with no --ignorefile still reports all 6 tracked findings and exits
          # 1. Without this line CI fails on the exact debt .trivyignore.yaml
          # is bookkeeping, and the gate looks broken for no visible reason.
          #
          # The action passes this straight through as --ignorefile.
          trivyignores: .trivyignore.yaml
          # Pinned for reproducibility, as above.
          version: v0.75.0

      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-os-results.sarif
          category: trivy-os

      - name: Upload Trivy SARIF (dependencies)
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-library-results.sarif
          category: trivy-library

      - name: Upload Trivy SARIF (app)
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-app-results.sarif
          category: trivy-app
